<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - میز {{ table_number }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .qr-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .restaurant-name {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .restaurant-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .table-number {
            font-size: 48px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .qr-code {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin: 20px 0;
        }

        .qr-code img {
            display: block;
            width: 300px;
            height: 300px;
        }

        .scan-instruction {
            font-size: 18px;
            color: #333;
            margin-top: 20px;
            line-height: 1.6;
        }

        .table-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .table-info-item {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-info-label {
            font-weight: bold;
            color: #333;
        }

        .print-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        @media print {
            body {
                background: white;
            }

            .qr-container {
                box-shadow: none;
                max-width: 100%;
            }

            .print-btn,
            .back-btn {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .qr-container {
                padding: 20px;
            }

            .restaurant-name {
                font-size: 24px;
            }

            .table-number {
                font-size: 36px;
            }

            .qr-code img {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="restaurant-name">🤖 رستوران روباتیک</div>
        <div class="restaurant-subtitle">سفارش آنلاین با QR Code</div>

        <div class="table-number">
            میز شماره {{ table_number }}
        </div>

        <div class="qr-code">
            <img src="{{ qr_url }}" alt="QR Code میز {{ table_number }}">
        </div>

        <div class="scan-instruction">
            📱 برای سفارش، QR Code را با دوربین موبایل خود اسکن کنید
        </div>

        <div class="table-info">
            <div class="table-info-item">
                <span class="table-info-label">شماره میز:</span>
                <span>{{ table_number }}</span>
            </div>
            <div class="table-info-item">
                <span class="table-info-label">تعداد صندلی:</span>
                <span>{{ table_info.seats }}</span>
            </div>
            <div class="table-info-item">
                <span class="table-info-label">URL سفارش:</span>
                <span style="font-size: 12px;">{{ table_info.url }}</span>
            </div>
        </div>

        <button class="print-btn" onclick="window.print()">
            🖨️ چاپ QR Code
        </button>

        <br>

        <a href="/qr/dashboard/" class="back-btn">
            ← بازگشت به داشبورد
        </a>
    </div>

    <script>
        // Auto-focus for better printing experience
        window.addEventListener('load', function() {
            document.title = 'QR Code - میز {{ table_number }}';
        });
    </script>
</body>
</html>
