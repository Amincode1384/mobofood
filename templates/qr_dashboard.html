<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد QR Code - مدیریت میزها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 36px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #666;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .table-number {
            font-size: 28px;
            font-weight: bold;
            color: #764ba2;
        }

        .table-seats {
            background: #f8f9fa;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            color: #666;
        }

        .qr-preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .qr-preview img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .table-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .table-btn-view {
            background: #667eea;
            color: white;
        }

        .table-btn-view:hover {
            background: #5568d3;
        }

        .table-btn-print {
            background: #28a745;
            color: white;
        }

        .table-btn-print:hover {
            background: #218838;
        }

        .stats {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 16px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .success-message {
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .tables-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 داشبورد مدیریت QR Code</h1>
            <p>مدیریت و چاپ QR Code برای {{ tables|length }} میز رستوران</p>

            <div class="actions">
                <button class="btn btn-primary" onclick="downloadAllQRCodes()">
                    📥 دانلود تمام QR Codeها (ZIP)
                </button>
                <button class="btn btn-primary" onclick="printAllTables()">
                    🖨️ چاپ تمام میزها
                </button>
                <a href="/dashboard/" class="btn btn-secondary">
                    ← بازگشت به داشبورد اصلی
                </a>
            </div>

            <div id="successMessage" class="success-message"></div>
        </div>

        <div class="stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">{{ tables|length }}</div>
                    <div class="stat-label">تعداد میزها</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSeats">0</div>
                    <div class="stat-label">مجموع صندلی‌ها</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">100%</div>
                    <div class="stat-label">QR Code آماده</div>
                </div>
            </div>
        </div>

        <div class="tables-grid">
            {% for table in tables %}
            <div class="table-card">
                <div class="table-header">
                    <div class="table-number">میز {{ table.number }}</div>
                    <div class="table-seats">{{ table.info.seats }} صندلی</div>
                </div>

                <div class="qr-preview">
                    <img src="{{ table.qr_url }}" alt="QR Code میز {{ table.number }}">
                </div>

                <div class="table-actions">
                    <a href="{{ table.page_url }}" target="_blank" class="table-btn table-btn-view">
                        👁️ مشاهده صفحه QR
                    </a>
                    <button class="table-btn table-btn-print" onclick="printTable({{ table.number }})">
                        🖨️ چاپ QR Code
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // محاسبه مجموع صندلی‌ها
        document.addEventListener('DOMContentLoaded', function() {
            const tables = {{ tables|safe|json_script:"tables-data" }};
            let totalSeats = 0;

            {% for table in tables %}
            totalSeats += {{ table.info.seats }};
            {% endfor %}

            document.getElementById('totalSeats').textContent = totalSeats;
        });

        // چاپ یک میز خاص
        function printTable(tableNumber) {
            window.open(`/qr/${tableNumber}/page/`, '_blank');
            setTimeout(() => {
                showMessage(`QR Code میز ${tableNumber} برای چاپ باز شد`);
            }, 500);
        }

        // چاپ تمام میزها
        function printAllTables() {
            if (!confirm('آیا می‌خواهید صفحه چاپ برای تمام میزها باز شود؟')) {
                return;
            }

            {% for table in tables %}
            setTimeout(() => {
                window.open('/qr/{{ table.number }}/page/', '_blank');
            }, {{ forloop.counter0 }} * 500);
            {% endfor %}

            showMessage('صفحات چاپ برای تمام میزها در حال باز شدن است...');
        }

        // دانلود تمام QR Codeها به صورت ZIP
        async function downloadAllQRCodes() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ در حال تولید فایل ZIP...';

            try {
                const response = await fetch('/qr/generate-all/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error('خطا در تولید فایل ZIP');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'qr_codes_all_tables.zip';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                showMessage('✅ فایل ZIP با موفقیت دانلود شد!');
            } catch (error) {
                alert('خطا در دانلود فایل: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '📥 دانلود تمام QR Codeها (ZIP)';
            }
        }

        // نمایش پیام موفقیت
        function showMessage(message) {
            const msgEl = document.getElementById('successMessage');
            msgEl.textContent = message;
            msgEl.style.display = 'block';

            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
