{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>آشپزخانه | Midnight Kitchen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/Dashboard.css' %}">
</head>
<body>

<header class="kh-header">
    <div class="kh-brand"><i class="bi bi-egg-fried"></i> آشپزخانه</div>

    <div class="kh-header-right">
        <span class="kh-clock mono" id="headerClock">--:--:--</span>
        <span class="kh-conn" id="connStatus">
            <span class="dot"></span> <span id="connStatusText">در حال اتصال...</span>
        </span>
    </div>
</header>

<main class="kh-board">

    <section class="kh-column" data-column="new">
        <div class="kh-col-head col-new">
            <i class="bi bi-bell-fill"></i> سفارش‌های جدید
            <span class="kh-count" id="countNew">0</span>
        </div>
        <div class="kh-col-body" id="colNew">
            <div class="kh-empty">سفارش جدیدی نیست</div>
        </div>
    </section>

    <section class="kh-column" data-column="cooking">
        <div class="kh-col-head col-cooking">
            <i class="bi bi-fire"></i> در حال آماده‌سازی
            <span class="kh-count" id="countCooking">0</span>
        </div>
        <div class="kh-col-body" id="colCooking">
            <div class="kh-empty">چیزی در حال پخت نیست</div>
        </div>
    </section>

    <section class="kh-column" data-column="waiting">
        <div class="kh-col-head col-waiting">
            <i class="bi bi-hourglass-split"></i> منتظر تأیید مشتری
            <span class="kh-count" id="countWaiting">0</span>
        </div>
        <div class="kh-col-body" id="colWaiting">
            <div class="kh-empty">سفارشی منتظر تأیید نیست</div>
        </div>
    </section>

</main>

<div class="kh-toast-stack" id="toastStack"></div>

<script src="{% static 'js/kitchen.js' %}"></script>
</body>
</html>
